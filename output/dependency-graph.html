],"outputParams":["data","error","successful"],"requiredParams":["fileId","propertyKey"]},{"id":"GOOGLESUPER_UPDATE_FILE_PUT","name":"Update File (Metadata)","description":"Updates file metadata. Uses PATCH semantics (partial update) as per Google Drive API v3 — only explicitly provided fields are updated, so omit fields you do not intend to overwrite. Use this tool to modify attributes of an existing file like its name, description, or parent folders. To move a file, ","toolkit":"googlesuper","category":"Drive","inputParams":["name","fileId","starred","mime_type","add_parents","description","ocr_language","remove_parents","writers_can_share","supports_all_drives","keep_revision_forever","use_domain_admin_access","viewers_can_copy_content"],"outputParams":["data","error","successful"],"requiredParams":["fileId"]},{"id":"GOOGLESUPER_UPDATE_FILE_REVISION_METADATA","name":"Update File Revision Metadata","description":"Updates ONLY the metadata properties of a specific file revision (keepForever, published, publishAuto, publishedOutsideDomain). IMPORTANT: This action does NOT update file content. To update file content, use EDIT_FILE or UPDATE_FILE_PUT instead. This action requires BOTH file_id AND revision_id par","toolkit":"googlesuper","category":"Drive","inputParams":["file_id","published","keepForever","publishAuto","revision_id","publishedOutsideDomain"],"outputParams":["data","error","successful"],"requiredParams":["file_id","revision_id"]},{"id":"GOOGLESUPER_LIST_TEAM_DRIVES","name":"List Team Drives (Deprecated)","description":"Tool to list Team Drives (deprecated, use List Shared Drives instead). Use when you need to retrieve Team Drives using the legacy endpoint.","toolkit":"googlesuper","category":"Drive","inputParams":["q","alt","key","xgafv","fields","callback","pageSize","pageToken","quotaUser","uploadType","oauth_token","prettyPrint","access_token","upload_protocol","useDomainAdminAccess"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_UPDATE_TEAM_DRIVE","name":"Update Team Drive (Deprecated)","description":"Tool to update a Team Drive's metadata. Deprecated: Use the drives.update endpoint instead. Use when you need to modify Team Drive properties.","toolkit":"googlesuper","category":"Drive","inputParams":["name","themeId","colorRgb","teamDriveId","restrictions","backgroundImageFile","useDomainAdminAccess"],"outputParams":["data","error","successful"],"requiredParams":["teamDriveId"]},{"id":"GOOGLESUPER_UPLOAD_FILE","name":"Upload File","description":"Uploads a file (max 5MB) to Google Drive, placing it in the specified folder or root if no valid folder ID is provided. Always creates a new file (never updates existing); use GOOGLEDRIVE_EDIT_FILE to update with a stable file_id. Uploaded files are private by default; configure sharing via GOOGLEDR","toolkit":"googlesuper","category":"Drive","inputParams":["file_to_upload","folder_to_upload_to"],"outputParams":["data","error","successful"],"requiredParams":["file_to_upload"]},{"id":"GOOGLESUPER_UPLOAD_UPDATE_FILE","name":"Upload/Update File Content","description":"Tool to update file content in Google Drive by uploading new binary content. Use when you need to replace the contents of an existing file with new file data.","toolkit":"googlesuper","category":"Drive","inputParams":["fileId","addParents","uploadType","ocrLanguage","removeParents","file_to_upload","supportsAllDrives","keepRevisionForever","useContentAsIndexableText"],"outputParams":["data","error","successful"],"requiredParams":["fileId","file_to_upload"]},{"id":"GOOGLESUPER_WATCH_FILE","name":"Watch File for Changes","description":"Tool to subscribe to push notifications for changes to a specific file. Use when you need to monitor a file for modifications and receive real-time notifications at a webhook URL.","toolkit":"googlesuper","category":"Drive","inputParams":["id","type","token","fileId","params","address","payload","expiration","includeLabels","acknowledgeAbuse","supportsAllDrives","supportsTeamDrives","includePermissionsForView"],"outputParams":["data","error","successful"],"requiredParams":["fileId","id","type","address"]},{"id":"GOOGLESUPER_FETCH_EMAILS","name":"Fetch emails","description":"Fetches a list of email messages from a Gmail account, supporting filtering, pagination, and optional full content retrieval. Results are NOT sorted by recency; sort by internalDate client-side. The messages field may be absent or empty (valid no-results state); always null-check before accessing me","toolkit":"googlesuper","category":"Gmail","inputParams":["query","user_id","verbose","ids_only","label_ids","page_token","max_results","include_payload","include_spam_trash"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_ADD_LABEL_TO_EMAIL","name":"Modify email labels","description":"Adds and/or removes specified Gmail labels for a message; ensure `message_id` and all `label_ids` are valid (use 'listLabels' for custom label IDs).","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","message_id","add_label_ids","remove_label_ids"],"outputParams":["data","error","successful"],"requiredParams":["message_id"]},{"id":"GOOGLESUPER_LIST_LABELS","name":"List Gmail labels","description":"Retrieves all system and user-created labels for a Gmail account in a single unpaginated response. Primary use: obtain internal label IDs (e.g., 'Label_123') required by other Gmail tools — display names cannot be used as label identifiers and cause silent failures or errors. System labels (INBOX, U","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","include_details"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_BATCH_DELETE_MESSAGES","name":"Batch delete Gmail messages","description":"Tool to permanently delete multiple Gmail messages in bulk, bypassing Trash with no recovery possible. Use when you need to efficiently remove large numbers of emails (e.g., retention enforcement, mailbox hygiene). Use GMAIL_MOVE_TO_TRASH instead when reversibility may be needed. Always obtain expli","toolkit":"googlesuper","category":"Gmail","inputParams":["userId","messageIds"],"outputParams":["data","error","successful"],"requiredParams":["messageIds"]},{"id":"GOOGLESUPER_BATCH_MODIFY_MESSAGES","name":"Batch modify Gmail messages","description":"Modify labels on multiple Gmail messages in one efficient API call. Supports up to 1,000 messages per request for bulk operations like archiving, marking as read/unread, or applying custom labels. High-volume calls may return 429 rateLimitExceeded or 403 userRateLimitExceeded; apply exponential back","toolkit":"googlesuper","category":"Gmail","inputParams":["userId","messageIds","addLabelIds","removeLabelIds"],"outputParams":["data","error","successful"],"requiredParams":["messageIds"]},{"id":"GOOGLESUPER_LIST_THREADS","name":"List threads","description":"Retrieves a list of email threads from a Gmail account, identified by `user_id` (email address or 'me'), supporting filtering and pagination. Spam and trash are excluded by default unless explicitly targeted via `label:spam` or `label:trash` in the query.","toolkit":"googlesuper","category":"Gmail","inputParams":["query","user_id","verbose","page_token","max_results"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_CREATE_EMAIL_DRAFT","name":"Create email draft","description":"Creates a Gmail email draft. While all fields are optional per the Gmail API, practical validation requires at least one of recipient_email, cc, or bcc and at least one of subject or body. Supports To/Cc/Bcc recipients, subject, plain/HTML body (ensure `is_html=True` for HTML), attachments, and thre","toolkit":"googlesuper","category":"Gmail","inputParams":["cc","bcc","body","is_html","subject","user_id","thread_id","attachment","recipient_email","extra_recipients"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_DELETE_DRAFT","name":"Delete Draft","description":"Permanently deletes a specific Gmail draft using its ID with no recovery possible; verify the correct `draft_id` and obtain explicit user confirmation before calling. Ensure the draft exists and the user has necessary permissions for the given `user_id`.","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","draft_id"],"outputParams":["data","error","successful"],"requiredParams":["draft_id"]},{"id":"GOOGLESUPER_LIST_DRAFTS","name":"List Drafts","description":"Retrieves a paginated list of email drafts from a user's Gmail account. Use verbose=true to get full draft details including subject, body, sender, and timestamp. Draft ordering is non-guaranteed; iterate using page_token until it is absent to retrieve all drafts. Newly created drafts may not appear","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","verbose","page_token","max_results"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_CREATE_LABEL","name":"Create label","description":"Creates a new label with a unique name in the specified user's Gmail account. Returns a labelId (e.g., 'Label_123') required for downstream tools like GMAIL_ADD_LABEL_TO_EMAIL, GMAIL_BATCH_MODIFY_MESSAGES, and GMAIL_MODIFY_THREAD_LABELS — those tools do not accept display names.","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","label_name","text_color","background_color","label_list_visibility","message_list_visibility"],"outputParams":["data","error","successful"],"requiredParams":["label_name"]},{"id":"GOOGLESUPER_DELETE_LABEL","name":"Delete label from account (permanent)","description":"Permanently DELETES a user-created Gmail label from the account (not from a message). WARNING: This action DELETES the label definition itself, removing it from all messages. System labels (INBOX, SENT, UNREAD, etc.) cannot be deleted. To add/remove labels from specific messages, use GMAIL_ADD_LABEL","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","label_id"],"outputParams":["data","error","successful"],"requiredParams":["label_id"]},{"id":"GOOGLESUPER_DELETE_MESSAGE","name":"Delete message","description":"Permanently deletes a specific email message by its ID from a Gmail mailbox; for `user_id`, use 'me' for the authenticated user or an email address to which the authenticated user has delegated access.","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","message_id"],"outputParams":["data","error","successful"],"requiredParams":["message_id"]},{"id":"GOOGLESUPER_DELETE_THREAD","name":"Delete thread","description":"Tool to immediately and permanently delete a specified thread and all its messages. This operation cannot be undone. Use threads.trash instead for reversible deletion.","toolkit":"googlesuper","category":"Gmail","inputParams":["id","user_id"],"outputParams":["data","error","successful"],"requiredParams":["id"]},{"id":"GOOGLESUPER_FETCH_MESSAGE_BY_MESSAGE_ID","name":"Fetch message by message ID","description":"Fetches a specific email message by its ID, provided the `message_id` exists and is accessible to the authenticated `user_id`. Spam/trash messages are excluded unless upstream list/search calls used `include_spam_trash=true`. Use `internalDate` (milliseconds since epoch) rather than header `Date` fo","toolkit":"googlesuper","category":"Gmail","inputParams":["format","user_id","message_id"],"outputParams":["data","error","successful"],"requiredParams":["message_id"]},{"id":"GOOGLESUPER_FETCH_MESSAGE_BY_THREAD_ID","name":"Fetch Message by Thread ID","description":"Retrieves messages from a Gmail thread using its `thread_id`, where the thread must be accessible by the specified `user_id`. Returns a `messages` array; `thread_id` is not echoed in the response. Message order is not guaranteed — sort by `internalDate` to find oldest/newest. Check `labelIds` per me","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","thread_id","page_token"],"outputParams":["data","error","successful"],"requiredParams":["thread_id"]},{"id":"GOOGLESUPER_FORWARD_MESSAGE","name":"Forward email message","description":"Forward an existing Gmail message to specified recipients, preserving original body and attachments. Verify recipients and content before forwarding to avoid unintended exposure. Bulk forwarding may trigger 429/5xx rate limits; keep concurrency to 5–10 and apply backoff. Messages near Gmail's size l","toolkit":"googlesuper","category":"Gmail","inputParams":["cc","bcc","user_id","message_id","recipients","additional_text"],"outputParams":["data","error","successful"],"requiredParams":["message_id","recipients"]},{"id":"GOOGLESUPER_GET_DRAFT","name":"Get Draft","description":"Retrieves a single Gmail draft by its ID. Use this to fetch and inspect draft content before sending via GMAIL_SEND_DRAFT. The format parameter controls the level of detail returned.","toolkit":"googlesuper","category":"Gmail","inputParams":["format","user_id","draft_id"],"outputParams":["data","error","successful"],"requiredParams":["draft_id"]},{"id":"GOOGLESUPER_GET_LABEL","name":"Get label details","description":"Gets details for a specified Gmail label. Use this to retrieve label information including name, type, visibility settings, message/thread counts, and color.","toolkit":"googlesuper","category":"Gmail","inputParams":["id","user_id"],"outputParams":["data","error","successful"],"requiredParams":["id"]},{"id":"GOOGLESUPER_MODIFY_THREAD_LABELS","name":"Modify thread labels","description":"Adds or removes specified existing label IDs from a Gmail thread, affecting all its messages; ensure the thread ID is valid. To modify a single message only, use a message-level tool instead.","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","thread_id","add_label_ids","remove_label_ids"],"outputParams":["data","error","successful"],"requiredParams":["thread_id"]},{"id":"GOOGLESUPER_MOVE_THREAD_TO_TRASH","name":"Trash thread","description":"Moves the specified thread to the trash. Any messages that belong to the thread are also moved to the trash.","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","thread_id"],"outputParams":["data","error","successful"],"requiredParams":["thread_id"]},{"id":"GOOGLESUPER_UNTRASH_THREAD","name":"Untrash thread","description":"Tool to remove a thread from trash in Gmail. Use when you need to restore a deleted thread and its messages.","toolkit":"googlesuper","category":"Gmail","inputParams":["user_id","thread_id"],"outputParams":["data","error","successful"],"requiredParams":["thread_id"]},{"id":"GOOGLESUPER_REPLY_TO_THREAD","name":"Reply to email thread","description":"Sends a reply within a specific Gmail thread using the original thread's subject; do not provide a custom subject as it will start a new conversation instead of replying in-thread. Requires a valid `thread_id` and at least one of `recipient_email`, `cc`, or `bcc`. Supports attachments via the `attac","toolkit":"googlesuper","category":"Gmail","inputParams":["cc","bcc","is_html","user_id","thread_id","attachment","message_body","recipient_email","extra_recipients"],"outputParams":["data","error","successful"],"requiredParams":["thread_id"]},{"id":"GOOGLESUPER_CREATE_GOOGLE_SHEET1","name":"Create a Google Sheet","description":"Creates a new Google Spreadsheet in Google Drive. If a title is provided, the spreadsheet will be created with that name. If no title is provided, Google will create a spreadsheet with a default name like 'Untitled spreadsheet'. Optionally create the spreadsheet in a specific folder by providing eit","toolkit":"googlesuper","category":"Sheets","inputParams":["title","folder_id","folder_name"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_ADD_SHEET","name":"Add Sheet to Existing Spreadsheet","description":"Adds a new sheet to a spreadsheet. Supports three sheet types: GRID, OBJECT, and DATA_SOURCE. SHEET TYPES: - GRID (default): Standard spreadsheet with rows/columns. Use properties to set dimensions, tab color, etc. - OBJECT: Sheet containing a chart. Requires objectSheetConfig with chartSpec (basicC","toolkit":"googlesuper","category":"Sheets","inputParams":["title","properties","force_unique","spreadsheet_id","data_source_config","object_sheet_config"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id"]},{"id":"GOOGLESUPER_AGGREGATE_COLUMN_DATA","name":"Aggregate Column Data","description":"Searches for rows where a specific column matches a value and performs mathematical operations on data from another column.","toolkit":"googlesuper","category":"Sheets","inputParams":["operation","sheet_name","search_value","search_column","target_column","case_sensitive","has_header_row","spreadsheet_id","percentage_total","additional_filters"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id","sheet_name","target_column","operation"]},{"id":"GOOGLESUPER_CREATE_SPREADSHEET_COLUMN","name":"Create spreadsheet column","description":"Creates a new column in a Google Spreadsheet. Specify the target sheet using sheet_id (numeric) or sheet_name (text). If neither is provided, defaults to the first sheet (sheet_id=0).","toolkit":"googlesuper","category":"Sheets","inputParams":["sheet_id","sheet_name","insert_index","spreadsheet_id","response_ranges","inherit_from_before","response_include_grid_data","include_spreadsheet_in_response"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id"]},{"id":"GOOGLESUPER_CREATE_SPREADSHEET_ROW","name":"Create spreadsheet row","description":"Inserts a new, empty row into a specified sheet of a Google Spreadsheet at a given index, optionally inheriting formatting from the row above.","toolkit":"googlesuper","category":"Sheets","inputParams":["sheet_id","sheet_name","insert_index","spreadsheet_id","response_ranges","inherit_from_before","response_include_grid_data","include_spreadsheet_in_response"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id"]},{"id":"GOOGLESUPER_DELETE_SHEET","name":"Delete Sheet","description":"Tool to delete a sheet (worksheet) from a spreadsheet. Use when you need to remove a specific sheet from a Google Sheet document.","toolkit":"googlesuper","category":"Sheets","inputParams":["sheetId","spreadsheetId","responseRanges","responseIncludeGridData","includeSpreadsheetInResponse"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheetId","sheetId"]},{"id":"GOOGLESUPER_FIND_WORKSHEET_BY_TITLE","name":"Find worksheet by title (Deprecated)","description":"DEPRECATED: Use GetSpreadsheetInfo instead. Finds a worksheet by its exact, case-sensitive title within a Google Spreadsheet; returns a boolean indicating if found and the matched worksheet's metadata when found, or None when not found.","toolkit":"googlesuper","category":"Sheets","inputParams":["spreadsheet_id","worksheet_title"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id","worksheet_title"]},{"id":"GOOGLESUPER_FORMAT_CELL","name":"Format cell","description":"Applies text and background cell formatting to a specified range in a Google Sheets worksheet.","toolkit":"googlesuper","category":"Sheets","inputParams":["red","blue","bold","green","range","italic","fontSize","underline","sheet_name","worksheet_id","end_row_index","strikethrough","spreadsheet_id","start_row_index","end_column_index","start_column_index"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id"]},{"id":"GOOGLESUPER_GET_SHEET_NAMES","name":"Get sheet names","description":"Lists all worksheet names from a specified Google Spreadsheet (which must exist), useful for discovering sheets before further operations.","toolkit":"googlesuper","category":"Sheets","inputParams":["exclude_hidden","spreadsheet_id"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id"]},{"id":"GOOGLESUPER_GET_SPREADSHEET_BY_DATA_FILTER","name":"Get Spreadsheet by Data Filter","description":"Returns the spreadsheet at the given ID, filtered by the specified data filters. Use this tool when you need to retrieve specific subsets of data from a Google Sheet based on criteria like A1 notation, developer metadata, or grid ranges. Important: This action is designed for filtered data retrieval","toolkit":"googlesuper","category":"Sheets","inputParams":["dataFilters","spreadsheetId","includeGridData","excludeTablesInBandedRanges"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheetId"]},{"id":"GOOGLESUPER_GET_SPREADSHEET_INFO","name":"Get spreadsheet info","description":"Retrieves metadata for a Google Spreadsheet using its ID. By default, returns essential information (ID, title, sheet properties) to avoid payload size issues. Use the fields parameter for comprehensive metadata or specific fields.","toolkit":"googlesuper","category":"Sheets","inputParams":["fields","ranges","spreadsheet_id","include_grid_data","exclude_tables_in_banded_ranges"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_LIST_SPREADSHEET_CHARTS","name":"Get Charts from Spreadsheet","description":"Tool to retrieve a list of all charts from a specified Google Sheets spreadsheet. Use when you need to get chart IDs and their specifications for embedding or referencing elsewhere, such as in Google Docs.","toolkit":"googlesuper","category":"Sheets","inputParams":["spreadsheet_id"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id"]},{"id":"GOOGLESUPER_LOOKUP_SPREADSHEET_ROW","name":"Look up spreadsheet row","description":"Finds the first row in a Google Spreadsheet where a cell's entire content exactly matches the query string, searching within a specified A1 notation range or the first sheet by default.","toolkit":"googlesuper","category":"Sheets","inputParams":["query","range","case_sensitive","spreadsheet_id","value_render_option","normalize_whitespace","date_time_render_option"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id","query"]},{"id":"GOOGLESUPER_SPREADSHEETS_SHEETS_COPY_TO","name":"Copy Sheet to Another Spreadsheet","description":"Tool to copy a single sheet from a spreadsheet to another spreadsheet. Use when you need to duplicate a sheet into a different spreadsheet.","toolkit":"googlesuper","category":"Sheets","inputParams":["sheet_id","spreadsheet_id","destination_spreadsheet_id"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id","sheet_id","destination_spreadsheet_id"]},{"id":"GOOGLESUPER_SPREADSHEETS_VALUES_APPEND","name":"Append Values to Spreadsheet","description":"Tool to append values to a spreadsheet. Use when you need to add new data to the end of an existing table in a Google Sheet.","toolkit":"googlesuper","category":"Sheets","inputParams":["range","values","spreadsheetId","majorDimension","insertDataOption","valueInputOption","includeValuesInResponse","responseValueRenderOption","responseDateTimeRenderOption"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheetId","range","valueInputOption","values"]},{"id":"GOOGLESUPER_SPREADSHEETS_VALUES_BATCH_CLEAR","name":"Batch Clear Spreadsheet Values","description":"Tool to clear one or more ranges of values from a spreadsheet. Use when you need to remove data from specific cells or ranges while keeping formatting and other properties intact.","toolkit":"googlesuper","category":"Sheets","inputParams":["ranges","spreadsheet_id"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id","ranges"]},{"id":"GOOGLESUPER_SPREADSHEETS_VALUES_BATCH_GET_BY_DATA_FILTER","name":"Batch Get Spreadsheet Values by Data Filter","description":"Tool to return one or more ranges of values from a spreadsheet that match the specified data filters. Use when you need to retrieve specific data sets based on filtering criteria rather than entire sheets or fixed ranges.","toolkit":"googlesuper","category":"Sheets","inputParams":["dataFilters","spreadsheetId","majorDimension","valueRenderOption","dateTimeRenderOption"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheetId","dataFilters"]},{"id":"GOOGLESUPER_UPDATE_SHEET_PROPERTIES","name":"Update Sheet Properties","description":"Tool to update properties of a sheet (worksheet) within a Google Spreadsheet, such as its title, index, visibility, tab color, or grid properties. Use this when you need to modify the metadata or appearance of a specific sheet.","toolkit":"googlesuper","category":"Sheets","inputParams":["spreadsheetId","responseRanges","updateSheetProperties","responseIncludeGridData","includeSpreadsheetInResponse"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheetId","updateSheetProperties"]},{"id":"GOOGLESUPER_UPDATE_SPREADSHEET_PROPERTIES","name":"Update Spreadsheet Properties","description":"Tool to update SPREADSHEET-LEVEL properties such as the spreadsheet's title, locale, time zone, or auto-recalculation settings. Use when you need to modify the overall configuration of a Google Spreadsheet. NOTE: To update individual SHEET properties (like renaming a specific sheet/tab), use GOOGLES","toolkit":"googlesuper","category":"Sheets","inputParams":["fields","properties","spreadsheetId","responseRanges","responseIncludeGridData","includeSpreadsheetInResponse"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheetId","properties","fields"]},{"id":"GOOGLESUPER_CREATE_TASK_LIST","name":"Create a task list","description":"Creates a new task list with the specified title and returns a tasklist_id. Use the returned tasklist_id (not the title) when calling GOOGLETASKS_INSERT_TASK or other task operations. Duplicate titles are permitted by the API, so verify existing lists before creating to avoid unintended duplicates.","toolkit":"googlesuper","category":"Tasks","inputParams":["tasklist_title"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_title"]},{"id":"GOOGLESUPER_BULK_INSERT_TASKS","name":"Bulk Insert Tasks (Deprecated)","description":"DEPRECATED: Use BatchExecute instead. Creates multiple tasks in a Google Tasks list in a single operation using HTTP batching. Use when you need to create many tasks efficiently (reducing round-trips compared to individual insert calls).","toolkit":"googlesuper","category":"Tasks","inputParams":["tasks","batch_size","tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id","tasks"]},{"id":"GOOGLESUPER_CLEAR_TASKS","name":"Clear tasks","description":"Permanently and irreversibly clears all completed tasks from a specified Google Tasks list; this action is destructive, idempotent, and cannot be undone. Always require explicit user confirmation before invoking.","toolkit":"googlesuper","category":"Tasks","inputParams":["tasklist"],"outputParams":["data","error","successful"],"requiredParams":["tasklist"]},{"id":"GOOGLESUPER_INSERT_TASK","name":"Insert Task","description":"Creates a new task in a given `tasklist_id`, optionally as a subtask of an existing `task_parent` or positioned after an existing `task_previous` sibling, where both `task_parent` and `task_previous` must belong to the same `tasklist_id` if specified. IMPORTANT: Date fields (due, completed) accept v","toolkit":"googlesuper","category":"Tasks","inputParams":["id","due","etag","notes","title","hidden","status","deleted","completed","task_parent","tasklist_id","task_previous"],"outputParams":["data","error","successful"],"requiredParams":["title","tasklist_id"]},{"id":"GOOGLESUPER_DELETE_TASK","name":"Delete task","description":"Deletes a specified task from a Google Tasks list. Deletion is permanent and irreversible — confirm with the user before executing, and consider GOOGLETASKS_UPDATE_TASK or GOOGLETASKS_MOVE_TASK as non-destructive alternatives. Both tasklist_id and task_id are required parameters. The Google Tasks AP","toolkit":"googlesuper","category":"Tasks","inputParams":["task_id","tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id","task_id"]},{"id":"GOOGLESUPER_LIST_TASKS","name":"List Tasks","description":"Retrieves tasks from a Google Tasks list; all date/time strings must be RFC3339 UTC, and `showCompleted` must be true if `completedMin` or `completedMax` are specified. Response key for tasks is `tasks` (not `items`). No full-text search; filter client-side by title/notes. Results ordered by positio","toolkit":"googlesuper","category":"Tasks","inputParams":["dueMax","dueMin","pageToken","maxResults","showHidden","tasklistId","updatedMin","showDeleted","completedMax","completedMin","showCompleted"],"outputParams":["data","error","successful"],"requiredParams":["tasklistId"]},{"id":"GOOGLESUPER_LIST_TASK_LISTS","name":"List task lists","description":"Fetches the authenticated user's task lists from Google Tasks; results may be paginated. Response contains task lists under the `items` key. Multiple lists may share similar names — confirm the correct list by ID before passing to other tools.","toolkit":"googlesuper","category":"Tasks","inputParams":["pageToken","maxResults"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_DELETE_TASK_LIST","name":"Delete task list","description":"Permanently deletes an existing Google Task list, identified by `tasklist_id`, along with all its tasks; this operation is irreversible. Require explicit user confirmation before calling; do not invoke in read-only or exploratory flows.","toolkit":"googlesuper","category":"Tasks","inputParams":["tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id"]},{"id":"GOOGLESUPER_CREATE_REPORT_TASK","name":"Create Report Task","description":"Tool to create a report task as a long-running asynchronous request for customized Google Analytics event data reports. Use when you need to generate large or complex reports that process asynchronously.","toolkit":"googlesuper","category":"Tasks","inputParams":["parent","reportDefinition"],"outputParams":["data","error","successful"],"requiredParams":["parent"]},{"id":"GOOGLESUPER_GET_REPORT_TASK","name":"Get Report Task","description":"Tool to get report metadata about a specific report task. Use after creating a report task to check its processing state or inspect its report definition.","toolkit":"googlesuper","category":"Tasks","inputParams":["name"],"outputParams":["data","error","successful"],"requiredParams":["name"]},{"id":"GOOGLESUPER_LIST_REPORT_TASKS","name":"List Report Tasks","description":"Tool to list all report tasks for a Google Analytics property. Use when you need to retrieve report task definitions and their execution status.","toolkit":"googlesuper","category":"Tasks","inputParams":["parent","pageSize","pageToken"],"outputParams":["data","error","successful"],"requiredParams":["parent"]},{"id":"GOOGLESUPER_GET_TASK","name":"Get Task","description":"Retrieve a specific Google Task. REQUIRES both `tasklist_id` and `task_id`. Tasks cannot be retrieved by ID alone - you must always specify which task list contains the task. Use this to refresh task details before display or edits rather than relying on potentially stale results from GOOGLETASKS_LI","toolkit":"googlesuper","category":"Tasks","inputParams":["task_id","tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id","task_id"]},{"id":"GOOGLESUPER_GET_TASK_LIST","name":"Get task list","description":"Retrieves a specific task list from the user's Google Tasks if the `tasklist_id` exists for the authenticated user.","toolkit":"googlesuper","category":"Tasks","inputParams":["tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id"]},{"id":"GOOGLESUPER_MOVE_TASK","name":"Move Task","description":"Moves the specified task to another position in the task list or to a different task list. Use cases: - Reorder tasks within a list (use 'previous' parameter) - Create subtasks by moving a task under a parent (use 'parent' parameter) - Move tasks between different task lists (use 'destinationTasklis","toolkit":"googlesuper","category":"Tasks","inputParams":["task","parent","previous","tasklist","destinationTasklist"],"outputParams":["data","error","successful"],"requiredParams":["tasklist","task"]},{"id":"GOOGLESUPER_PATCH_TASK","name":"Patch Task","description":"Partially updates an existing task (identified by `task_id`) within a specific Google Task list (identified by `tasklist_id`), modifying only the provided attributes from `TaskInput` (e.g., `title`, `notes`, `due` date, `status`) and requiring both the task and list to exist.","toolkit":"googlesuper","category":"Tasks","inputParams":["id","due","etag","notes","title","hidden","status","deleted","task_id","completed","tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id","task_id"]},{"id":"GOOGLESUPER_PATCH_TASK_LIST","name":"Patch task list","description":"Updates the title of an existing Google Tasks task list.","toolkit":"googlesuper","category":"Tasks","inputParams":["tasklist_id","updated_title"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id"]},{"id":"GOOGLESUPER_QUERY_REPORT_TASK","name":"Query Report Task","description":"Tool to retrieve a report task's content. Use this after creating a report task with CreateReportTask and confirming it is in ACTIVE state. This method returns an error if the report task's state is not ACTIVE.","toolkit":"googlesuper","category":"Tasks","inputParams":["name","limit","offset"],"outputParams":["data","error","successful"],"requiredParams":["name"]},{"id":"GOOGLESUPER_UPDATE_TASK","name":"Update Task (Deprecated)","description":"DEPRECATED: Use GOOGLETASKS_PATCH_TASK instead. Full-update (PUT-style) operation that overwrites unspecified fields with empty/default values, which can cause data loss. Prefer GOOGLETASKS_PATCH_TASK unless a complete field replacement is explicitly required.","toolkit":"googlesuper","category":"Tasks","inputParams":["due","notes","title","status","task_id","completed","tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id","task_id"]},{"id":"GOOGLESUPER_UPDATE_TASK_FULL","name":"Update Task (Full Replacement)","description":"Tool to fully replace an existing Google Task using PUT method. Use when you need to update the entire task resource, not just specific fields. This method requires all required fields (id, title) and replaces the complete task, unlike PATCH which supports partial updates.","toolkit":"googlesuper","category":"Tasks","inputParams":["id","due","etag","links","notes","title","hidden","parent","status","deleted","task_id","position","completed","tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id","task_id","id","title"]},{"id":"GOOGLESUPER_UPDATE_TASK_LIST","name":"Update Task List","description":"Updates the authenticated user's specified task list.","toolkit":"googlesuper","category":"Tasks","inputParams":["title","tasklist_id"],"outputParams":["data","error","successful"],"requiredParams":["tasklist_id","title"]},{"id":"GOOGLESUPER_RENDER_AERIAL_VIDEO","name":"Render Aerial Video","description":"Starts rendering an aerial view video for a US postal address. Returns a video ID that can be used with lookupVideo to retrieve the video once rendering completes. Rendering typically takes up to a few hours.","toolkit":"googlesuper","category":"YouTube","inputParams":["address"],"outputParams":["data","error","successful"],"requiredParams":["address"]},{"id":"GOOGLESUPER_LOOKUP_AERIAL_VIDEO","name":"Lookup Aerial Video","description":"Tool to look up an aerial view video by address or video ID. Returns video metadata including state and URIs for playback. Use when you need to retrieve a previously rendered aerial video or check the status of a video render request. Note that receiving a video is a billable event.","toolkit":"googlesuper","category":"YouTube","inputParams":["address","videoId"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_CREATE_DOCUMENT","name":"Create a document","description":"Creates a new Google Docs document using the provided title as filename and inserts the initial text at the beginning if non-empty, returning the document's ID and metadata (excluding body content).","toolkit":"googlesuper","category":"Docs","inputParams":["text","title"],"outputParams":["data","error","successful"],"requiredParams":["title"]},{"id":"GOOGLESUPER_COPY_DOCUMENT","name":"Copy Google Document","description":"Tool to create a copy of an existing Google Document. Use this to duplicate a document, for example, when using an existing document as a template. The copied document will have a default title (e.g., 'Copy of [original title]') if no new title is provided, and will be placed in the user's root Goog","toolkit":"googlesuper","category":"Docs","inputParams":["title","document_id","include_shared_drives"],"outputParams":["data","error","successful"],"requiredParams":["document_id"]},{"id":"GOOGLESUPER_CREATE_DOCUMENT2","name":"Create blank document (Deprecated)","description":"DEPRECATED: Use GOOGLEDOCS_CREATE_DOCUMENT instead. Tool to create a blank Google Docs document with a specified title. Use when you need to create a new, empty document.","toolkit":"googlesuper","category":"Docs","inputParams":["title"],"outputParams":["data","error","successful"],"requiredParams":["title"]},{"id":"GOOGLESUPER_CREATE_DOCUMENT_MARKDOWN","name":"Create Document Markdown","description":"Creates a new Google Docs document, optionally initializing it with a title and content provided as Markdown text.","toolkit":"googlesuper","category":"Docs","inputParams":["title","markdown_text"],"outputParams":["data","error","successful"],"requiredParams":["title"]},{"id":"GOOGLESUPER_GET_DOCUMENT_BY_ID","name":"Get document by id","description":"Retrieves an existing Google Document by its ID; will error if the document is not found.","toolkit":"googlesuper","category":"Docs","inputParams":["id"],"outputParams":["data","error","successful"],"requiredParams":["id"]},{"id":"GOOGLESUPER_SEARCH_DOCUMENTS","name":"Search Documents","description":"Search for Google Documents using various filters including name, content, date ranges, and more.","toolkit":"googlesuper","category":"Docs","inputParams":["query","order_by","page_token","max_results","starred_only","created_after","modified_after","shared_with_me","include_trashed","include_shared_drives"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_EXPORT_DOCUMENT_AS_PDF","name":"Export Google Doc as PDF","description":"Tool to export a Google Docs file as PDF using the Google Drive API. Use when you need to generate a PDF version of a Google Docs document for download or distribution. Note: Google Drive enforces a 10MB limit on export content.","toolkit":"googlesuper","category":"Docs","inputParams":["file_id","filename"],"outputParams":["data","error","successful"],"requiredParams":["file_id"]},{"id":"GOOGLESUPER_GET_DOCUMENT_PLAINTEXT","name":"Get document plain text","description":"Retrieve a Google Doc by ID and return a best-effort plain-text rendering. Converts document structure into plain text including paragraphs, lists, and tables without requiring clients to traverse complex Docs API JSON.","toolkit":"googlesuper","category":"Docs","inputParams":["document_id","include_tables","include_footers","include_headers","include_footnotes","table_row_delimiter","include_tabs_content","table_cell_delimiter"],"outputParams":["data","error","successful"],"requiredParams":["document_id"]},{"id":"GOOGLESUPER_UPDATE_DOCUMENT_BATCH","name":"Update Document Batch (Deprecated)","description":"DEPRECATED: Use UpdateExistingDocument instead. Tool to apply one or more updates to a Google Document. Use when you need to perform batch operations on a document, such as inserting text, updating styles, or modifying document structure. Supports 35+ request types including insertText, replaceAllTe","toolkit":"googlesuper","category":"Docs","inputParams":["requests","document_id","write_control"],"outputParams":["data","error","successful"],"requiredParams":["document_id","requests"]},{"id":"GOOGLESUPER_UPDATE_DOCUMENT_MARKDOWN","name":"Update Document Markdown","description":"Replaces the entire content of an existing Google Docs document with new Markdown text; requires edit permissions for the document.","toolkit":"googlesuper","category":"Docs","inputParams":["id","markdown"],"outputParams":["data","error","successful"],"requiredParams":["id","markdown"]},{"id":"GOOGLESUPER_UPDATE_DOCUMENT_SECTION_MARKDOWN","name":"Update Document Section Markdown","description":"Tool to insert or replace a section of a Google Docs document with Markdown content. Use when you need to update only a section of a document by specifying start and optional end indices. Supports full Markdown formatting.","toolkit":"googlesuper","category":"Docs","inputParams":["end_index","document_id","start_index","markdown_text"],"outputParams":["data","error","successful"],"requiredParams":["document_id","markdown_text"]},{"id":"GOOGLESUPER_UPDATE_DOCUMENT_STYLE","name":"Update Document Style","description":"Tool to update the overall document style, such as page size, margins, and default text direction. Use when you need to modify the global style settings of a Google Document.","toolkit":"googlesuper","category":"Docs","inputParams":["fields","tab_id","document_id","document_style"],"outputParams":["data","error","successful"],"requiredParams":["document_id","document_style"]},{"id":"GOOGLESUPER_UPDATE_EXISTING_DOCUMENT","name":"Update existing document","description":"Applies programmatic edits, such as text insertion, deletion, or formatting, to a specified Google Doc using the `batchUpdate` API method.","toolkit":"googlesuper","category":"Docs","inputParams":["edit_docs","document_id"],"outputParams":["data","error","successful"],"requiredParams":["document_id","edit_docs"]},{"id":"GOOGLESUPER_CREATE_MEET","name":"Create Google Meet Space","description":"Creates a new Google Meet space with optional configuration. Does not attach to any calendar event — calendar linking requires a separate Calendar tool call. Capture `meetingUri`, `meetingCode`, and `space.name` from the response immediately for downstream lookups. Requires `meetings.space.created` ","toolkit":"googlesuper","category":"Meet","inputParams":["config"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_END_ACTIVE_CONFERENCE","name":"End active conference","description":"Ends an active conference in a Google Meet space. REQUIRES 'space_name' parameter (e.g., 'spaces/jQCFfuBOdN5z' or just 'jQCFfuBOdN5z'). Use when you need to terminate an ongoing conference in a specified space. This operation only succeeds if a conference is actively running in the space. You must a","toolkit":"googlesuper","category":"Meet","inputParams":["space_name"],"outputParams":["data","error","successful"],"requiredParams":["space_name"]},{"id":"GOOGLESUPER_GET_MEET","name":"Get Meet details","description":"Retrieve details of a Google Meet space using its unique identifier. Newly created spaces may return incomplete data; retry after 1–3 seconds if needed.","toolkit":"googlesuper","category":"Meet","inputParams":["space_name"],"outputParams":["data","error","successful"],"requiredParams":["space_name"]},{"id":"GOOGLESUPER_GET_RECORDINGS_BY_CONFERENCE_RECORD_ID","name":"Get recordings by conference record ID","description":"Retrieves recordings from Google Meet for a given conference record ID. Only returns recordings if recording was enabled and permitted by the organizer's domain policies; a valid conference_record_id does not guarantee recordings exist. After a meeting ends, recordings may take several minutes to pr","toolkit":"googlesuper","category":"Meet","inputParams":["conference_record_id"],"outputParams":["data","error","successful"],"requiredParams":["conference_record_id"]},{"id":"GOOGLESUPER_GET_CONFERENCE_RECORD_BY_NAME","name":"Get conference record by name","description":"Tool to get a specific conference record by its resource name. Use when you have the conference record ID and need to retrieve detailed information about a single meeting instance.","toolkit":"googlesuper","category":"Meet","inputParams":["name"],"outputParams":["data","error","successful"],"requiredParams":["name"]},{"id":"GOOGLESUPER_GET_TRANSCRIPTS_BY_CONFERENCE_RECORD_ID","name":"Get transcripts by conference record ID","description":"Retrieves all transcripts for a specific Google Meet conference using its conference_record_id. Transcripts require processing time after a meeting ends — empty results may be transient; retry after a delay before concluding no transcripts exist. Returns results only if transcription was enabled dur","toolkit":"googlesuper","category":"Meet","inputParams":["page_size","page_token","conference_record_id"],"outputParams":["data","error","successful"],"requiredParams":["conference_record_id"]},{"id":"GOOGLESUPER_CREATE_PRESENTATION","name":"Create Google Slides Presentation","description":"Tool to create a blank Google Slides presentation. Use when you need to initialize a new presentation with a specific title, locale, or page size.","toolkit":"googlesuper","category":"Slides","inputParams":["title","locale","pageSize","presentationId"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_PRESENTATIONS_BATCH_UPDATE","name":"Update Presentation (Batch/Markdown)","description":"Update Google Slides presentations using markdown content or raw API text. Supports professional themes, auto-formatting, and multiple slide types (title, bullet, table, quote, image, two-column).","toolkit":"googlesuper","category":"Slides","inputParams":["requests","writeControl","markdown_text","presentationId"],"outputParams":["data","error","successful"],"requiredParams":["presentationId"]},{"id":"GOOGLESUPER_CREATE_SLIDES_MARKDOWN","name":"Create Slides from Markdown","description":"Creates a new Google Slides presentation from Markdown text. Automatically splits content into slides using '---' separators and applies appropriate templates based on content structure.","toolkit":"googlesuper","category":"Slides","inputParams":["title","markdown_text"],"outputParams":["data","error","successful"],"requiredParams":["title","markdown_text"]},{"id":"GOOGLESUPER_PRESENTATIONS_COPY_FROM_TEMPLATE","name":"Copy Google Slides from Template","description":"Tool to create a new Google Slides presentation by duplicating an existing template deck via Drive file copy. Use when you need to preserve themes, masters, and layouts exactly as they appear in the template. After copying, use GOOGLESLIDES_PRESENTATIONS_BATCH_UPDATE to replace placeholder text or i","toolkit":"googlesuper","category":"Slides","inputParams":["new_title","parent_folder_id","template_presentation_id"],"outputParams":["data","error","successful"],"requiredParams":["template_presentation_id"]},{"id":"GOOGLESUPER_PRESENTATIONS_GET","name":"Get Presentation","description":"Tool to retrieve the latest version of a presentation. Use after obtaining the presentation ID.","toolkit":"googlesuper","category":"Slides","inputParams":["fields","presentationId","presentationName"],"outputParams":["data","error","successful"],"requiredParams":[]},{"id":"GOOGLESUPER_PRESENTATIONS_PAGES_GET","name":"Get Presentation Page","description":"Tool to get the latest version of a specific page in a presentation. Use when you need to inspect slide, layout, master, or notes page details.","toolkit":"googlesuper","category":"Slides","inputParams":["pageObjectId","presentationId"],"outputParams":["data","error","successful"],"requiredParams":["presentationId","pageObjectId"]},{"id":"GOOGLESUPER_PRESENTATIONS_PAGES_GET_THUMBNAIL","name":"Get Page Thumbnail (Deprecated)","description":"DEPRECATED: Use GOOGLESLIDES_GET_PAGE_THUMBNAIL2 instead. Tool to generate and return a thumbnail image URL for a specific page. Use when you need a quick preview of a slide page after loading it.","toolkit":"googlesuper","category":"Slides","inputParams":["pageObjectId","presentationId","thumbnailProperties.mimeType","thumbnailProperties.thumbnailSize"],"outputParams":["data","error","successful"],"requiredParams":["presentationId","pageObjectId"]},{"id":"GOOGLESUPER_GET_CONDITIONAL_FORMAT_RULES","name":"Get conditional format rules","description":"List conditional formatting rules for each sheet (or a selected sheet) in a normalized, easy-to-edit form. Use when you need to view, audit, or prepare to modify conditional format rules.","toolkit":"googlesuper","category":"Forms","inputParams":["sheet_id","sheet_title","spreadsheet_id","exclude_tables_in_banded_ranges"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id"]},{"id":"GOOGLESUPER_MUTATE_CONDITIONAL_FORMAT_RULES","name":"Mutate conditional format rules","description":"Add, update, delete, or reorder conditional format rules on a Google Sheet. Use when you need to create, modify, or remove conditional formatting without manually building batchUpdate requests. Supports four operations: ADD (create new rule), UPDATE (replace existing rule), DELETE (remove rule), MOV","toolkit":"googlesuper","category":"Forms","inputParams":["rule","index","sheet_id","new_index","operation","spreadsheet_id"],"outputParams":["data","error","successful"],"requiredParams":["spreadsheet_id","operation","sheet_id"]},{"id":"GITHUB_LIST_USER_PROJECTS","name":"List user projects","description":"Retrieves a list of projects for a org"]},{"id":"GITHUB_ADD_OR_UPDATE_TEAM_MEMBERSHIP_FOR_USER","name":"Add or update team membership for a user","description":"Adds a GitHub user to a team or updates their role (member or maintainer), inviting them to the organization if not already a member; idempotent, returning current details if no change is made.","toolkit":"github","category":"Repos","inputParams":["org","role","username","team_slug"],"outputParams":["data","error","successful"],"requiredParams":["org","team_slug","username"]},{"id":"GITHUB_ADD_OR_UPDATE_TEAM_PROJECT_PERMISSIONS","name":"Add or update team project permissions","description":"Adds a classic project to a team or updates the team's permission on it. This endpoint grants or updates permissions for a team on a specific classic project (not Projects V2). The authenticated user must have admin permissions for the project. Both the team and project must belong to the same organ","toolkit":"github","category":"Repos","inputParams":["org","team_slug","permission","project_id"],"outputParams":["data","error","successful"],"requiredParams":["org","team_slug","project_id"]},{"id":"GITHUB_GET_A_PROJECT","name":"Get a project","description":"Retrieves detailed information for a specific GitHub project (V2) using its project number and owner. Note: This action uses GitHub's Projects V2 REST API. The legacy Projects (classic) REST API was sunset on April 1, 2025. The project is identified by its number (visible in the project URL) and own","toolkit":"github","category":"Repos","inputParams":["org","username","project_number"],"outputParams":["data","error","successful"],"requiredParams":["project_number"]},{"id":"GITHUB_LIST_ORGANIZATION_PROJECTS","name":"List organization projects","description":"Lists projects (V2) for a specified GitHub organization, with optional search query and cursor-based pagination.","toolkit":"github","category":"Repos","inputParams":["q","org","after","before","per_page"],"outputParams":["data","error","successful"],"requiredParams":["org"]},{"id":"GITHUB_ADD_OR_UPDATE_TEAM_REPOSITORY_PERMISSIONS","name":"Add or update team repository permissions","description":"Sets or updates a team's permission level for a repository within an organization; the team must be a member of the organization.","toolkit":"github","category":"Repos","inputParams":["org","repo","owner","team_slug","permission"],"outputParams":["data","error","successful"],"requiredParams":["org","team_slug","owner","repo"]},{"id":"GITHUB_ADD_PROJECT_COLLABORATOR","name":"Add project collaborator","description":"Adds a specified GitHub user as a collaborator to an existing organization project with a given permission level. Note: This endpoint is for organization projects (classic). You must be an organization owner or a project admin to add a collaborator. Classic projects are being deprecated in favor of ","toolkit":"github","category":"Repos","inputParams":["username","permission","project_id"],"outputParams":["data","error","successful"],"requiredParams":["project_id","username"]},{"id":"GITHUB_GET_A_REPOSITORY","name":"Get a repository","description":"Retrieves detailed information about an existing and accessible GitHub repository.","toolkit":"github","category":"Repos","inputParams":["repo","owner"],"outputParams":["data","error","successful"],"requiredParams":["owner","repo"]},{"id":"GITHUB_ADD_REPOSITORY_TO_APP_INSTALLATION","name":"Add a repository to an app installation","description":"Adds a repository to a GitHub App installation, granting the app access; requires authenticated user to have admin rights for the repository and access to the installation.","toolkit":"github","category":"Repos","inputParams":["repository_id","installation_id"],"outputParams":["data","error","successful"],"requiredParams":["installation_id","repository_id"]},{"id":"GITHUB_GET_AN_ORGANIZATION_SECRET","name":"Get an organization secret","description":"Gets an organization secret's metadata (e.g., name, creation/update dates, v xt_to_insert"]},{"id":"GOOGLESUPER_LIST_FILE_LABELS","name":"List File Labels","description":"Tool to list the labels already applied to a file in Google Drive. An empty labels array is a valid response indicating no labels are applied, not an error. This tool shows only applied labels; label_id and field_id values required by other Drive label tools must be obtained from admin configuration","toolkit":"googlesuper","category":"Gmail","inputParams":["file_id","page_token","max_results"],"outputParams":["data","error","successful"],"requiredParams":["file_id"]},{"id":"GOOGLESUPER_LIST_HISTORY","name":"List Gmail history","description":"Tool to list Gmail mailbox change history since a known startHistoryId. Use for incremental mailbox syncs. Persist the latest historyId as a checkpoint across sessions; without it, incremental sync is unreliable. An empty history list in the response is valid and means no new changes occurred.","toolkit":"googlesuper","category":"Other","inputParams":["user_id","label_id","page_token","max_results","history_types","start_history_id"],"outputParams":["data","error","successful"],"requiredParams":["start_history_id"]},{"id":"GOOGLESUPER_MODIFY_FILE_LABELS","name":"Modify File Labels","description":"Modifies the set of labels applied to a file. Returns a list of the labels that were added or modified. Use when you need to programmatically change labels on a Google Drive file, such as adding, updating, or removing them.","toolkit":"googlesuper","category":"Gmail","inputParams":["kind","file_id","label_modifications"],"outputParams":["data","error","successful"],"requiredParams":["file_id","label_modifications"]},{"id":"GOOGLESUPER_QUERY_TABLE","name":"Query Spreadsheet Table","description":"DEPRECATED: Use GOOGLESHEETS_VALUES_GET / GOOGLESHEETS_BATCH_GET for table reads and GOOGLESHEETS_LOOKUP_SPREADSHEET_ROW for row lookup/filter workflows. Execute SQL-like SELECT queries against Google Spreadsheet tables. Table names correspond to sheet/ const g = svg.append('g');

svg.append('defs').append('marker')
  .attr('id', 'arrow')
  .attr('viewBox', '0 -5 10 10')
  .attr('refX', 20)
  .attr('refY', 0)
  .attr('markerWidth', 6)
  .attr('markerHeight', 6)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,-5L10,0L0,5')
  .attr('fill', '#8b949e');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.05, 8])
  .on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoom);

// ─── Simulation ───
const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(120))
  .force('charge', d3.forceManyBody().strength(-200))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(20))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

// ─── Draw links ───
const link = g.append('g')
  .selectAll('line')
  .data(links)
  .join('line')
  .attr('class', 'link')
  .attr('stroke', d => d.providerRank === 1 ? '#58a6ff' : '#30363d')
  .attr('stroke-width', d => d.providerRank === 1 ? 1.8 : 1.0)
  .attr('stroke-opacity', d => 0.15 + (d.confidence || 0.5) * 0.5)
  .attr('marker-end', 'url(#arrow)')
  .on('mouseover', (event, d) => {
    const tt = document.getElementById('edge-tooltip');
    const conf = d.confidence != null ? (d.confidence * 100).toFixed(0) + '%' : 'N/A';
    const rank = d.providerRank ? ' (rank #' + d.providerRank + ' provider)' : '';
    tt.innerHTML = '<strong>' + d.source.id + '</strong> → <strong>' + d.target.id + '</strong><br>' +
      'Parameter: <em>' + d.parameter + '</em><br>' +
      'Confidence: ' + conf + rank + '<br>' +
      d.reason;
    tt.style.display = 'block';
    tt.style.left = (event.clientX + 12) + 'px';
    tt.style.top = (event.clientY + 12) + 'px';
  })
  .on('mouseout', () => {
    document.getElementById('edge-tooltip').style.display = 'none';
  });

// ─── Draw nodes ───
const node = g.append('g')
  .selectAll('.node')
  .data(nodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', dragStarted)
    .on('drag', dragged)
    .on('end', dragEnded));

node.append('circle')
  .attr('r', d => {
    // Size by connection count
    const conns = links.filter(l =>
      (l.source === d || l.source.id === d.id) ||
      (l.target === d || l.target.id === d.id)
    ).length;
    return Math.max(5, Math.min(16, 4 + conns * 0.8));
  })
  .attr('fill', d => getColor(d));

node.append('text')
  .attr('dy', d => {
    const conns = links.filter(l =>
      (l.source === d || l.source.id === d.id) ||
      (l.target === d || l.target.id === d.id)
    ).length;
    return Math.max(5, Math.min(16, 4 + conns * 0.8)) + 12;
  })
  .text(d => {
    // Shorten slug: remove toolkit prefix
    let label = d.id;
    if (label.startsWith('GOOGLESUPER_')) label = label.slice(12);
    else if (label.startsWith('GITHUB_')) label = label.slice(7);
    // Truncate long names
    if (label.length > 25) label = label.slice(0, 22) + '...';
    return label;
  });

// ─── Tooltip ───
node.on('mouseover', (event, d) => {
  const tt = document.getElementById('tooltip');
  const deps = links.filter(l => (l.target === d || l.target.id === d.id));
  const dependents = links.filter(l => (l.source === d || l.source.id === d.id));

  tt.innerHTML = `
    <div class="tt-name">${d.id}</div>
    <div class="tt-cat">${d.toolkit} / ${d.category}</div>
    <div class="tt-desc">${d.description || 'No description'}</div>
    <div class="tt-params">
      <strong>Required inputs:</strong> ${d.requiredParams.join(', ') || 'none'}<br>
      <strong>Depends on:</strong> ${deps.length} tool(s)<br>
      <strong>Depended on by:</strong> ${dependents.length} tool(s)
    </div>
  `;
  tt.style.display = 'block';

  // Position tooltip
  const x = event.clientX;
  const y = event.clientY;
  tt.style.left = (x + 15 > window.innerWidth - 420 ? x - 420 : x + 15) + 'px';
  tt.style.top = (y + 15 > window.innerHeight - 200 ? y - 200 : y + 15) + 'px';
})
.on('mouseout', () => {
  document.getElementById('tooltip').style.display = 'none';
})
.on('click', (event, d) => {
  event.stopPropagation();
  highlightConnections(d);
})
.on('dblclick', (event, d) => {
  // Center on node
  const transform = d3.zoomTransform(svg.node());
  const newTransform = d3.zoomIdentity
    .translate(width / 2, height / 2)
    .scale(transform.k)
    .translate(-d.x, -d.y);
  svg.transition().duration(500).call(zoom.transform, newTransform);
});

// Click background to clear
svg.on('click', () => clearHighlight());

// ─── Highlight logic ───
function highlightConnections(d) {
  const connectedIds = new Set();
  connectedIds.add(d.id);

  // Find all directly connected nodes
  links.forEach(l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    if (srcId === d.id) connectedIds.add(tgtId);
    if (tgtId === d.id) connectedIds.add(srcId);
  });

  node.classed('highlighted', n => n.id === d.id);
  node.classed('dimmed', n => !connectedIds.has(n.id));

  link.classed('highlighted', l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    return srcId === d.id || tgtId === d.id;
  });
  link.classed('dimmed', l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    return srcId !== d.id && tgtId !== d.id;
  });
}

function clearHighlight() {
  node.classed('highlighted', false).classed('dimmed', false);
  link.classed('highlighted', false).classed('dimmed', false);
}

// ─── Simulation tick ───
simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ─── Drag handlers ───
function dragStarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x;
  d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x;
  d.fy = event.y;
}
function dragEnded(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null;
  d.fy = null;
}

// ─── Search ───
document.getElementById('search').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  if (!query) {
    clearHighlight();
    node.style('display', null);
    link.style('display', null);
    return;
  }

  const matchIds = new Set();
  nodes.forEach(n => {
    if (n.id.toLowerCase().includes(query) || (n.name && n.name.toLowerCase().includes(query))) {
      matchIds.add(n.id);
    }
  });

  // Also show connected nodes
  const expandedIds = new Set(matchIds);
  links.forEach(l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    if (matchIds.has(srcId)) expandedIds.add(tgtId);
    if (matchIds.has(tgtId)) expandedIds.add(srcId);
  });

  node.classed('dimmed', n => !expandedIds.has(n.id));
  node.classed('highlighted', n => matchIds.has(n.id));

  link.classed('dimmed', l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    return !matchIds.has(srcId) && !matchIds.has(tgtId);
  });
  link.classed('highlighted', l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    return matchIds.has(srcId) || matchIds.has(tgtId);
  });
});

// ─── Filters ───
let currentToolkit = 'all';
let currentCategory = 'all';

function applyFilters() {
  const visibleIds = new Set();

  nodes.forEach(n => {
    const toolkitOk = currentToolkit === 'all' || n.toolkit === currentToolkit;
    const catOk = currentCategory === 'all' || n.category === currentCategory;
    if (toolkitOk && catOk) visibleIds.add(n.id);
  });

  node.style('display', n => visibleIds.has(n.id) ? null : 'none');
  link.style('display', l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    return visibleIds.has(srcId) && visibleIds.has(tgtId) ? null : 'none';
  });

  // Update stats
  const visibleLinks = links.filter(l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    return visibleIds.has(srcId) && visibleIds.has(tgtId);
  });
  document.getElementById('stats').textContent =
    visibleIds.size + ' nodes, ' + visibleLinks.length + ' edges';
}

document.getElementById('toolkit-filter').addEventListener('change', (e) => {
  currentToolkit = e.target.value;
  // Update category dropdown
  populateCategories();
  currentCategory = 'all';
  document.getElementById('category-filter').value = 'all';
  applyFilters();
});

document.getElementById('category-filter').addEventListener('change', (e) => {
  currentCategory = e.target.value;
  applyFilters();
});

function populateCategories() {
  const catSelect = document.getElementById('category-filter');
  catSelect.innerHTML = '<option value="all">All Categories</option>';

  const cats = new Set();
  graphData.categories.forEach(c => {
    if (currentToolkit === 'all' || c.toolkit === currentToolkit) {
      cats.add(c.name);
    }
  });

  Array.from(cats).sort().forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    catSelect.appendChild(opt);
  });
}
populateCategories();

// ─── Help toggle ───
document.getElementById('help-btn').addEventListener('click', () => {
  const panel = document.getElementById('help-panel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
});

// ─── Legend ───
function buildLegend() {
  const legend = document.getElementById('legend');
  let html = '<h3>Categories</h3>';

  const sorted = Object.entries(categoryColors).sort((a, b) => a[0].localeCompare(b[0]));
  sorted.forEach(([key, color]) => {
    const [toolkit, cat] = key.split('/');
    const prefix = toolkit === 'googlesuper' ? 'G' : 'GH';
    html += `<div class="legend-item" data-cat="${cat}" data-toolkit="${toolkit}">
      <span class="legend-dot" style="background:${color}"></span>
      <span>[${prefix}] ${cat}</span>
    </div>`;
  });

  legend.innerHTML = html;

  // Click legend item to filter
  legend.querySelectorAll('.legend-item').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.dataset.cat;
      const toolkit = el.dataset.toolkit;
      document.getElementById('toolkit-filter').value = toolkit;
      currentToolkit = toolkit;
      populateCategories();
      document.getElementById('category-filter').value = cat;
      currentCategory = cat;
      applyFilters();
    });
  });
}
buildLegend();

// ─── Initial stats ───
document.getElementById('stats').textContent =
  nodes.length + ' nodes, ' + links.length + ' edges';

// ─── Initial zoom to fit ───
setTimeout(() => {
  const bounds = g.node().getBBox();
  if (bounds.width > 0 && bounds.height > 0) {
    const scale = Math.min(
      0.9 * width / bounds.width,
      0.9 * height / bounds.height,
      2
    );
    const tx = width / 2 - scale * (bounds.x + bounds.width / 2);
    const ty = height / 2 - scale * (bounds.y + bounds.height / 2);
    svg.transition().duration(750)
      .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }
}, 2000);
</script>
</body>
</html>
